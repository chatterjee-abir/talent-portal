# ══════════════════════════════════════════════════════════════
#  TALENT PORTAL — Spring Boot Configuration
#  File: src/main/resources/application.properties
#
#  Spring Boot reads this file automatically on startup.
#  Every property here overrides Spring's built-in defaults.
# ══════════════════════════════════════════════════════════════


# ── SERVER ────────────────────────────────────────────────────
# The port the embedded Tomcat server listens on.
# React runs on 3000/5173, so we use 8080 to avoid conflicts.
server.port=8080


# ── DATABASE CONNECTION ───────────────────────────────────────
# jdbc:mysql://  → protocol (JDBC for MySQL)
# localhost      → MySQL is running on the same machine
# 3306           → MySQL's default port
# talent_portal  → the database we created with CREATE DATABASE
# useSSL=false   → don't require SSL for local development
# serverTimezone → prevents a timezone warning from the MySQL driver
spring.datasource.url=jdbc:mysql://localhost:3306/talent_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Toor123#@!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ── JPA / HIBERNATE ───────────────────────────────────────────
# ddl-auto=validate: at startup, Hibernate checks that Java entities
# match the database tables. It throws an error if they don't match.
# NEVER use 'create' or 'create-drop' on a real database — it drops all data.
spring.jpa.hibernate.ddl-auto=validate

# Log every SQL query Hibernate sends to MySQL (useful while learning).
# Set to false in production to reduce noise.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate we're using MySQL 8 syntax.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# ── DATA SEEDING ──────────────────────────────────────────────
# Spring Boot automatically runs src/main/resources/data.sql on startup
# when spring.sql.init.mode=always.
# defer-datasource-initialization=true ensures Hibernate creates/validates
# the schema BEFORE data.sql runs (prevents "table doesn't exist" errors).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# ── LOGGING ───────────────────────────────────────────────────
# Show Spring's startup banner and key events.
# Reduce Hibernate's verbose output to WARN level (keeps console readable).
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.com.talentportal=INFO
